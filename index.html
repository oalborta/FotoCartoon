<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro de IA Mágico</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ff4757; }
        .container { max-width: 500px; margin: 0 auto; }
        .menu, .camera-box, .result-box {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            width: 80%;
            transition: 0.3s;
        }
        button:hover { background: #e84118; }
        video, canvas, img {
            width: 100%;
            border-radius: 10px;
            background: #000;
            transform: scaleX(-1); /* Hace efecto espejo para que la selfie se sienta natural */
        }
        img#resultado-ia {
            transform: none; /* La foto final procesada no necesita efecto espejo */
        }
        .hidden { display: none; }
        .loading { font-style: italic; color: #f1c40f; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Espejo de IA Mágico ✨</h1>

    <!-- PANTALLA 1: MENÚ DE ESTILOS -->
    <div id="pantalla-menu" class="menu">
        <h3>Elige tu estilo de caricatura:</h3>
        <button onclick="seleccionarEstilo('A beautiful Pixar 3D 3d animation style character avatar, Disney movie portrait, highly detailed face')">Estilo Disney / Pixar 3D</button>
        <button onclick="seleccionarEstilo('Anime manga style illustration, colorful art, beautiful studio ghibli aesthetic, anime face')">Estilo Anime / Manga</button>
        <button onclick="seleccionarEstilo('Retro pop art comic book style drawing, bold lines, vibrant colors, vintage dots, comic poster art')">Estilo Pop Art / Comic</button>
    </div>

    <!-- PANTALLA 2: CÁMARA -->
    <div id="pantalla-camara" class="camera-box hidden">
        <video id="video" autoplay playsinline></video>
        <button onclick="tomarFoto()">📸 Capturar y Transformar</button>
        <button onclick="volverMenu()" style="background:#444;">Volver</button>
    </div>

    <!-- PANTALLA 3: PROCESANDO Y RESULTADO -->
    <div id="pantalla-resultado" class="result-box hidden">
        <div id="loading" class="loading">🪄 La IA está procesando tu selfie...<br><small>Si es la primera foto del día, puede tardar hasta 20 segundos en despertar al servidor gratuito.</small></div>
        <img id="resultado-ia" class="hidden" alt="Tu caricatura">
        <canvas id="canvas" class="hidden"></canvas>
        <button id="btn-reintentar" onclick="volverMenu()" class="hidden">✨ Hacer otra foto</button>
    </div>
</div>

<script>
    // REEMPLAZA ESTO CON TU TOKEN REAL DE HUGGING FACE
    const HF_TOKEN = "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"; 
    
    // Cambiamos a este modelo que es extremadamente compatible con envío directo de imágenes
    const MODEL_URL = "https://huggingface.co";

    let promptSeleccionado = "";
    let streamVo = null;

    function seleccionarEstilo(prompt) {
        promptSeleccionado = prompt;
        document.getElementById('pantalla-menu').classList.add('hidden');
        document.getElementById('pantalla-camara').classList.remove('hidden');
        encenderCamara();
    }

    async function encenderCamara() {
        try {
            // Fuerza estrictamente el uso de la cámara frontal ("user")
            const constraints = {
                audio: false,
                video: {
                    facingMode: { exact: "user" } 
                }
            };
            
            // Si el celular se pone estricto con el comando 'exact', intentamos el modo normal
            try {
                streamVo = await navigator.mediaDevices.getUserMedia(constraints);
            } catch(e) {
                streamVo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
            }

            document.getElementById('video').srcObject = streamVo;
        } catch (err) {
            alert("Error al abrir cámara frontal: " + err.message + "\nVerifica que diste permisos de cámara en tu navegador.");
        }
    }

    function tomarFoto() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Captura el tamaño exacto del video del teléfono
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        
        // Dibujamos la foto invirtiendo el espejo para que quede al derecho
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.setTransform(1, 0, 0, 1, 0, 0); // Restaurar lienzo

        // Apagar cámara
        if(streamVo) streamVo.getTracks().forEach(track => track.stop());

        document.getElementById('pantalla-camara').classList.add('hidden');
        document.getElementById('pantalla-resultado').classList.remove('hidden');
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('resultado-ia').classList.add('hidden');
        document.getElementById('btn-reintentar').classList.add('hidden');

        // Enviamos la foto optimizada en calidad media para que cargue rápido
        canvas.toBlob(enviarAIA, 'image/jpeg', 0.7);
    }

    async function enviarAIA(blob) {
        try {
            // Enviamos el archivo binario limpio a la API, añadiendo el estilo seleccionado en las cabeceras
            const response = await fetch(MODEL_URL, {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${HF_TOKEN}`,
                    "Content-Type": "application/octet-stream",
                    "X-Prompt": promptSeleccionado // Pasamos el filtro deseado
                },
                body: blob 
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error("El servidor de IA está ocupado o iniciando. Intenta de nuevo. " + errText);
            }

            const respuestaBlob = await response.blob();
            
            // Si la respuesta no es una imagen válida, hubo un fallo en el servidor
            if (!respuestaBlob.type.startsWith('image/')) {
                throw new Error("La IA no devolvió una imagen válida.");
            }

            const urlImagenFinal = URL.createObjectURL(respuestaBlob);
            
            document.getElementById('loading').classList.add('hidden');
            const imgResultado = document.getElementById('resultado-ia');
            imgResultado.src = urlImagenFinal;
            imgResultado.classList.remove('hidden');
            document.getElementById('btn-reintentar').classList.remove('hidden');

        } catch (error) {
            alert("Aviso: " + error.message);
            volverMenu();
        }
    }

    function volverMenu() {
        if(streamVo) streamVo.getTracks().forEach(track => track.stop());
        document.getElementById('pantalla-menu').classList.remove('remove');
        document.getElementById('pantalla-menu').classList.remove('hidden');
        document.getElementById('pantalla-camara').classList.add('hidden');
        document.getElementById('pantalla-resultado').classList.add('hidden');
    }
</script>
</body>
</html>
