<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espejo de IA Mágico</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ff4757; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }
        .container { max-width: 450px; margin: 0 auto; }
        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            transition: 0.2s;
            box-sizing: border-box;
        }
        button:active { background: #e84118; transform: scale(0.98); }
        video, canvas {
            width: 100%;
            border-radius: 15px;
            background: #000;
        }
        video {
            transform: scaleX(-1); /* Efecto espejo natural para la selfie */
        }
        .hidden { display: none; }
        .loading { font-size: 16px; color: #f1c40f; padding: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Espejo Mágico de Filtros ✨</h1>
    <div class="subtitle">Transformación digital en tu celular</div>

    <!-- PANTALLA 1: MENÚ DE ESTILOS -->
    <div id="pantalla-menu" class="card">
        <h3 style="margin-top:0;">Elige tu estilo artístico:</h3>
        <button onclick="seleccionarEstilo('popart')">💥 Estilo Pop Art / Cómics</button>
        <button onclick="seleccionarEstilo('boceto')">✏️ Estilo Dibujo a Lápiz</button>
        <button onclick="seleccionarEstilo('retro')">🕹️ Estilo Retro Vintage</button>
    </div>

    <!-- PANTALLA 2: CÁMARA FRONTAL -->
    <div id="pantalla-camara" class="card hidden">
        <video id="video" autoplay playsinline></video>
        <button onclick="tomarFoto()">📸 Capturar y Transformar</button>
        <button onclick="volverMenu()" style="background:#444;">⬅️ Volver</button>
    </div>

    <!-- PANTALLA 3: RESULTADO ARTÍSTICO -->
    <div id="pantalla-resultado" class="card hidden">
        <div id="loading" class="loading">🪄 Procesando pixeles artísticos...</div>
        <canvas id="canvas-resultado"></canvas>
        <button id="btn-reintentar" onclick="volverMenu()">✨ Probar otro estilo</button>
    </div>
    
    <!-- Canvas auxiliar oculto para tomar la muestra del video -->
    <canvas id="canvas-oculto" class="hidden"></canvas>
</div>

<script>
    let estiloSeleccionado = "";
    let streamVo = null;

    function seleccionarEstilo(estilo) {
        estiloSeleccionado = estilo;
        document.getElementById('pantalla-menu').classList.add('hidden');
        document.getElementById('pantalla-camara').classList.remove('hidden');
        encenderCamara();
    }

    async function encenderCamara() {
        try {
            // Configuración para forzar estrictamente la cámara frontal "selfie" en el celular
            const opciones = {
                audio: false,
                video: { facingMode: "user" }
            };
            streamVo = await navigator.mediaDevices.getUserMedia(opciones);
            document.getElementById('video').srcObject = streamVo;
        } catch (err) {
            try {
                // Alternativa secundaria si falla la detección automática
                streamVo = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('video').srcObject = streamVo;
            } catch(e) {
                alert("Error de permisos: Activa los accesos de cámara en el navegador de tu celular.");
            }
        }
    }

    function tomarFoto() {
        const video = document.getElementById('video');
        const canvasOculto = document.getElementById('canvas-oculto');
        const canvasResultado = document.getElementById('canvas-resultado');
        
        const ctxOculto = canvasOculto.getContext('2d');
        const ctxResultado = canvasResultado.getContext('2d');

        // Sincronizamos las dimensiones de captura con las del video real
        const width = video.videoWidth || 640;
        const height = video.videoHeight || 480;
        
        canvasOculto.width = width;
        canvasOculto.height = height;
        canvasResultado.width = width;
        canvasResultado.height = height;

        // Dibujamos la selfie invirtiendo el lienzo para corregir el espejo de la cámara frontal
        ctxOculto.translate(width, 0);
        ctxOculto.scale(-1, 1);
        ctxOculto.drawImage(video, 0, 0, width, height);
        ctxOculto.setTransform(1, 0, 0, 1, 0, 0); // Limpiar transformación

        // Apagamos la cámara de inmediato para ahorrar recursos del teléfono
        if(streamVo) streamVo.getTracks().forEach(track => track.stop());

        document.getElementById('pantalla-camara').classList.add('hidden');
        document.getElementById('pantalla-resultado').classList.remove('hidden');
        document.getElementById('loading').classList.remove('hidden');

        // Aplicamos el procesamiento matemático sobre la matriz de pixeles
        setTimeout(() => {
            const imgData = ctxOculto.getImageData(0, 0, width, height);
            
            if (estiloSeleccionado === "popart") {
                aplicarFiltroPopArt(imgData);
            } else if (estiloSeleccionado === "boceto") {
                aplicarFiltroBoceto(imgData);
            } else if (estiloSeleccionado === "retro") {
                aplicarFiltroRetro(imgData);
            }

            // Pintamos los pixeles modificados en el lienzo de resultado
            ctxResultado.putImageData(imgData, 0, 0);
            document.getElementById('loading').classList.add('hidden');
        }, 100);
    }

    // --- ALGORITMOS DE PROCESAMIENTO NATIVO DE PIXELES ---

    function aplicarFiltroPopArt(imgData) {
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            // Calculamos el brillo del pixel actual
            let brillo = (data[i] + data[i+1] + data[i+2]) / 3;
            // Contrastamos drásticamente los colores para simular arte pop impreso
            if (brillo > 128) {
                data[i] = 255;     // Rojo al máximo
                data[i+1] = 71;    // Verde pastel
                data[i+2] = 87;    // Azul pop
            } else {
                data[i] = 30;      // Sombras oscuras azuladas
                data[i+1] = 30;
                data[i+2] = 46;
            }
        }
    }

    function aplicarFiltroBoceto(imgData) {
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            // Conversión nativa a escala de grises estilo lápiz
            let gris = 0.3 * data[i] + 0.59 * data[i+1] + 0.11 * data[i+2];
            // Marcamos las líneas intensas
            let trazo = gris < 90 ? 30 : 240;
            data[i] = trazo;
            data[i+1] = trazo;
            data[i+2] = trazo;
        }
    }

    function aplicarFiltroRetro(imgData) {
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            // Reducción drástica de color para look vintage de cartucho de videojuego antiguo
            data[i] = Math.round(data[i] / 64) * 64;
            data[i+1] = Math.round(data[i+1] / 64) * 64;
            data[i+2] = Math.round(data[i+2] / 64) * 64;
        }
    }

    function volverMenu() {
        if(streamVo) streamVo.getTracks().forEach(track => track.stop());
        document.getElementById('pantalla-menu').classList.remove('hidden');
        document.getElementById('pantalla-camara').classList.add('hidden');
        document.getElementById('pantalla-resultado').classList.add('hidden');
    }
</script>
</body>
</html>
