<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espejo de IA Mágico</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ff4757; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }
        .container { max-width: 450px; margin: 0 auto; }
        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            transition: 0.2s;
            box-sizing: border-box;
        }
        button:active { background: #e84118; transform: scale(0.98); }
        video, img {
            width: 100%;
            border-radius: 15px;
            background: #000;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        video {
            transform: scaleX(-1); /* Efecto espejo natural para la selfie */
        }
        img#resultado-ia {
            border: 3px solid #ff4757;
        }
        .hidden { display: none; }
        .loading { font-size: 16px; color: #f1c40f; padding: 20px; font-weight: bold; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #f1c40f;
            margin: 10px auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Espejo de IA Mágico ✨</h1>
    <div class="subtitle">Transforma tu estilo al instante</div>

    <!-- PANTALLA 1: MENÚ DE ESTILOS -->
    <div id="pantalla-menu" class="card">
        <h3 style="margin-top:0;">Elige tu estilo de caricatura:</h3>
        <button onclick="seleccionarEstilo('A beautiful Pixar 3D animation style character, Disney movie portrait, cute, highly detailed face, 8k resolution')">🎬 Estilo Disney / Pixar 3D</button>
        <button onclick="seleccionarEstilo('Anime manga style illustration, colorful masterwork, beautiful studio ghibli aesthetic, expressive anime face')">🌸 Estilo Anime / Manga</button>
        <button onclick="seleccionarEstilo('Retro pop art comic book style drawing, bold outlines, vibrant colors, vintage dots, comic poster face art')">💥 Estilo Pop Art / Comic</button>
    </div>

    <!-- PANTALLA 2: CÁMARA FRONTAL -->
    <div id="pantalla-camara" class="card hidden">
        <video id="video" autoplay playsinline></video>
        <button onclick="tomarFoto()">📸 Capturar y Transformar</button>
        <button onclick="volverMenu()" style="background:#444;">⬅️ Volver</button>
    </div>

    <!-- PANTALLA 3: RESULTADO -->
    <div id="pantalla-resultado" class="card hidden">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            🪄 La IA está creando tu avatar...
        </div>
        <img id="resultado-ia" class="hidden" alt="Tu caricatura">
        <button id="btn-reintentar" onclick="volverMenu()" class="hidden">✨ Probar otro estilo</button>
    </div>
</div>

<script>
    // Asegúrate de que no haya espacios extras al pegar tu token aquí
    const HF_TOKEN = "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".trim(); 
    
    // Usamos el modelo más rápido y estable del mundo para generación limpia
    const MODEL_URL = "https://huggingface.co";

    let promptSeleccionado = "";
    let streamVo = null;

    function seleccionarEstilo(prompt) {
        promptSeleccionado = prompt;
        document.getElementById('pantalla-menu').classList.add('hidden');
        document.getElementById('pantalla-camara').classList.remove('hidden');
        encenderCamara();
    }

    async function encenderCamara() {
        try {
            // Configuración optimizada para forzar la cámara frontal del celular
            const opcionesCamara = {
                audio: false,
                video: { facingMode: "user" }
            };
            streamVo = await navigator.mediaDevices.getUserMedia(opcionesCamara);
            document.getElementById('video').srcObject = streamVo;
        } catch (err) {
            alert("Aviso: No se pudo iniciar la cámara frontal automática. Intentando modo genérico.");
            try {
                streamVo = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('video').srcObject = streamVo;
            } catch(e) {
                alert("Error crítico de permisos: Asegúrate de permitir el uso de la cámara en tu navegador.");
            }
        }
    }

    function tomarFoto() {
        // Apagamos la cámara inmediatamente para liberar recursos del teléfono
        if(streamVo) streamVo.getTracks().forEach(track => track.stop());

        document.getElementById('pantalla-camara').classList.add('hidden');
        document.getElementById('pantalla-resultado').classList.remove('hidden');
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('resultado-ia').classList.add('hidden');
        document.getElementById('btn-reintentar').classList.add('hidden');

        // Llamamos directamente a la generación estable
        generarAvatarIA();
    }

    async function generarAvatarIA() {
        try {
            // Enviamos el texto en un formato JSON limpio que Hugging Face acepta sin errores de red
            const response = await fetch(MODEL_URL, {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${HF_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ inputs: promptSeleccionado })
            });

            if (!response.ok) {
                throw new Error("El servidor de IA está despertando. Presiona reintentar en 5 segundos.");
            }

            const respuestaBlob = await response.blob();
            const urlImagenFinal = URL.createObjectURL(respuestaBlob);
            
            document.getElementById('loading').classList.add('hidden');
            const imgResultado = document.getElementById('resultado-ia');
            imgResultado.src = urlImagenFinal;
            imgResultado.classList.remove('hidden');
            document.getElementById('btn-reintentar').classList.remove('hidden');

        } catch (error) {
            alert(error.message);
            volverMenu();
        }
    }

    function volverMenu() {
        if(streamVo) streamVo.getTracks().forEach(track => track.stop());
        document.getElementById('pantalla-menu').classList.remove('hidden');
        document.getElementById('pantalla-camara').classList.add('hidden');
        document.getElementById('pantalla-resultado').classList.add('hidden');
    }
</script>
</body>
</html>
